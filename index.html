<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regnskapsverktøy</title>
<style>body{font:14px system-ui;margin:0;background:#f5f7fa;color:#17202a}header{background:#17365d;color:#fff;padding:18px}main{max-width:1400px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #d8e0ea;border-radius:9px;padding:14px;margin-bottom:12px}.tools,.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.pick,input,select{font:inherit;border:1px solid #4472c4;border-radius:6px;padding:8px 11px;background:#fff}.pick,.primary,.tabs .on{background:#4472c4;color:#fff}.pick input{display:none}#status{margin-left:auto;color:#667085}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:9px;padding:13px}.card small{color:#667085}.card b{display:block;font-size:19px;margin-top:4px}.neg{color:#b42318}.pos{color:#067647}.scroll{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#17365d;color:#fff}td.desc{white-space:normal;min-width:270px}.num{text-align:right}.barrow{display:grid;grid-template-columns:minmax(160px,260px) 1fr 110px;gap:10px;margin:8px 0}.bar{height:18px;background:#e8eef6;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#4472c4}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}#status{width:100%;margin:0}}</style></head><body>
<header><h1>Privat regnskapsverktøy</h1><div>Filer behandles lokalt i nettleseren.</div></header><main>
<div class="box tools"><label class="pick">Last opp filer<input id="files" type="file" multiple accept=".xlsx,.xls,.csv,.pdf"></label><button id="export" class="primary">Eksporter Excel</button><button id="save">Lagre lokalt</button><button id="clear">Tøm</button><span id="status">Laster filstøtte...</span></div>
<div class="tabs"><button class="on" data-view="overview">Oversikt</button><button data-view="transactions">Transaksjoner</button><button data-view="uncategorized">Ikke kategorisert</button><button data-view="rules">Regler</button></div>
<section id="overview" class="view on"><div id="cards" class="cards"></div><div class="box"><h2>Utgifter per kategori</h2><div id="catbars"></div></div><div class="box"><h2>Utgifter per måned</h2><div id="monthbars"></div></div></section>
<section id="transactions" class="view"><div class="box"><div class="filters"><input id="search" placeholder="Søk"><select id="source"><option value="">Alle kilder</option></select><select id="month"><option value="">Alle måneder</option></select><select id="category"><option value="">Alle kategorier</option></select></div><div class="scroll"><table><thead><tr><th>Dato</th><th>Kilde</th><th>Beskrivelse</th><th>Original kategori</th><th>Beløp</th><th>Kategori</th><th>Med</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
<section id="uncategorized" class="view"><div class="box"><h2>Ikke kategorisert</h2><div id="uncat"></div></div></section>
<section id="rules" class="view"><div class="box"><h2>Regler</h2><div class="tools"><input id="ruleText" placeholder="Trefftekst"><select id="ruleCat"></select><button id="addRule">Legg til</button></div><div id="ruleList"></div></div></section>
</main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function loadScript(url){return new Promise((ok,fail)=>{let s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
async function loadLibraries(){let errors=[];for(const urls of [['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']]){let good=false;for(const u of urls){try{await loadScript(u);good=true;break}catch{}}if(!good)errors.push(urls[0].includes('xlsx')?'Excel':'PDF')}if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';$('#status').textContent=errors.length?'Mangler støtte for: '+errors.join(', '):'Klar for opplasting'}
const CATS=['Abonnement og digitale tjenester','Alkohol','Avgifter og offentlige betalinger','Bil og drivstoff','Bolig','Bøker og medier','Dagligvarer','Elektronikk og programvare','Familie og lommepenger','Forsikring','Frakt og porto','Gebyr og renter','Godteri og snacks','Helse og personlig','Hobby, korps og fritid','Innbetaling/refusjon','Intern overføring','Klær og sko','Lån og sparing','Lønn','Markedsføring','Netthandel og øvrige varer','Parkering og bom','Restaurant og takeaway','Reise og overnatting','Strøm og energi','Sykkel','Telefon og internett','Transport','Ikke kategorisert'];
const BASE=[['bicycle','Sykkel'],['sykkel','Sykkel'],['grocery','Dagligvarer'],['supermarket','Dagligvarer'],['rema 1000','Dagligvarer'],['kiwi ','Dagligvarer'],['bunnpris','Dagligvarer'],['coop prix','Dagligvarer'],['restaurant','Restaurant og takeaway'],['fast food','Restaurant og takeaway'],['fuel dispenser','Bil og drivstoff'],['tesla','Bil og drivstoff'],['circle k','Bil og drivstoff'],['uno-x','Bil og drivstoff'],['skyttelpass','Parkering og bom'],['parking','Parkering og bom'],['atb','Transport'],['bus lines','Transport'],['passenger rail','Transport'],['hotel','Reise og overnatting'],['clothing','Klær og sko'],['shoe stores','Klær og sko'],['music stores','Hobby, korps og fritid'],['sporting goods','Hobby, korps og fritid'],['skolekorps','Hobby, korps og fritid'],['speider','Hobby, korps og fritid'],['electronics','Elektronikk og programvare'],['computer software','Elektronikk og programvare'],['google one','Abonnement og digitale tjenester'],['youtube','Abonnement og digitale tjenester'],['amazon prime','Abonnement og digitale tjenester'],['vinmonopolet','Alkohol'],['book stores','Bøker og medier'],['aliexpress','Netthandel og øvrige varer'],['temu','Netthandel og øvrige varer'],['advertising services','Markedsføring'],['candy/nut/confection','Godteri og snacks'],['posten norge','Frakt og porto'],['postnord','Frakt og porto'],['skatteetaten','Avgifter og offentlige betalinger'],['lønn','Lønn'],['aker solutions','Lønn'],['renter','Gebyr og renter'],['kontoregulering','Intern overføring'],['revolut::','Intern overføring'],['nordnet bank','Intern overføring'],['bank norwegian','Intern overføring'],['kredittbanken','Intern overføring'],['tilde stavik','Familie og lommepenger'],['sigrid stavik','Familie og lommepenger'],['fremtind','Forsikring'],['tryg forsikring','Forsikring'],['enter forsikring','Forsikring'],['fortum','Strøm og energi'],['agva kraft','Strøm og energi'],['lyse tele','Telefon og internett'],['lånekasse','Lån og sparing']];
let state={tx:[],rules:[...BASE]};const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(n||0);
function asDate(v){if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10);let s=String(v||''),m=s.match(/(\d{4})-(\d\d)-(\d\d)/);if(m)return m[0];m=s.match(/(\d\d)\.(\d\d)\.(\d{2,4})/);return m?`${m[3].length===2?'20'+m[3]:m[3]}-${m[2]}-${m[1]}`:''}
function classify(desc,orig,amount,type){let t=norm(desc+' '+orig);if(amount>0){if(t.includes('kontoregulering')||t.includes('nordnet bank'))return['Intern overføring',false];if(t.includes('lønn')||t.includes('aker solutions'))return['Lønn',true];return['Innbetaling/refusjon',true]}for(const[k,c]of state.rules)if(t.includes(norm(k)))return[c,c!=='Intern overføring'];if(['innbetaling','creditvoucher'].includes(norm(type)))return['Intern overføring',false];return['Ikke kategorisert',true]}
function add(o){o.key=[o.date,o.source,norm(o.desc),Number(o.amount).toFixed(2)].join('|');if(state.tx.some(x=>x.key===o.key))return;[o.category,o.included]=classify(o.desc,o.orig,o.amount,o.type);state.tx.push(o)}
async function parseExcel(file){if(!window.XLSX)throw Error('Excel-biblioteket er ikke tilgjengelig');let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});for(const sn of wb.SheetNames){for(const r of XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null})){let d,desc,amount,type,orig='',source;if('Dato'in r&&'Forklaring'in r){source=file.name.toLowerCase().includes('sbanken')?'sBanken':file.name.toLowerCase().includes('alt')?'Alt-i-ett':'Bankkonto';d=asDate(r.Dato);desc=r.Forklaring;amount=Number(r['Inn på konto']||0)-Number(r['Ut fra konto']||0);type=amount>=0?'Innbetaling':'Utbetaling'}else if('TransactionDate'in r){source='Bank Norwegian';d=asDate(r.TransactionDate);desc=r.Text;amount=Number(r.Amount||0);type=r.Type;orig=r['Merchant Category']||''}else continue;if(d&&desc&&Number.isFinite(amount))add({date:d,month:d.slice(0,7),source,desc:String(desc),amount,type,orig,sheet:sn})}}}
async function parsePdf(file){if(!window.pdfjsLib)throw Error('PDF-biblioteket er ikke tilgjengelig');let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let p=1;p<=doc.numPages;p++){let c=await(await doc.getPage(p)).getTextContent(),text=c.items.map(x=>x.str).join(' '),re=/(\d{2}\.\d{2}\.\d{2})\s+\d{2}\.\d{2}\.\d{2}\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})(?=\s+\d{2}\.\d{2}\.\d{2}|$)/g,m;while((m=re.exec(text))){let d=asDate(m[1]),amount=Number(m[3].replace(/\./g,'').replace(',','.')),desc=m[2].trim();add({date:d,month:d.slice(0,7),source:'Coop Mastercard',desc,amount,type:desc.toLowerCase()==='innbetaling'?'Innbetaling':'Kjøp',orig:'',sheet:'PDF '+p})}}}
const opts=s=>CATS.map(c=>`<option${c===s?' selected':''}>${esc(c)}</option>`).join('');function group(a,k,v){let o={};a.forEach(x=>o[k(x)]=(o[k(x)]||0)+v(x));return o}function bars(sel,o){let a=Object.entries(o).sort((x,y)=>y[1]-x[1]),max=Math.max(...a.map(x=>x[1]),1);$(sel).innerHTML=a.map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><span class="bar"><i style="width:${v/max*100}%"></i></span><span class="num">${money(v)}</span></div>`).join('')||'Ingen data'}
function render(){state.tx.sort((a,b)=>a.date.localeCompare(b.date));let seen=state.tx.filter(x=>x.included),out=-seen.filter(x=>x.amount<0).reduce((n,x)=>n+x.amount,0),inc=seen.filter(x=>x.amount>0).reduce((n,x)=>n+x.amount,0),unc=seen.filter(x=>x.category==='Ikke kategorisert').length;$('#cards').innerHTML=[['Utgifter',money(out),'neg'],['Inntekter',money(inc),'pos'],['Netto',money(inc-out),inc-out<0?'neg':'pos'],['Transaksjoner',seen.length,''],['Ikke kategorisert',unc,unc?'neg':'']].map(x=>`<div class="card"><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('');bars('#catbars',group(seen.filter(x=>x.amount<0),x=>x.category,x=>-x.amount));bars('#monthbars',group(seen.filter(x=>x.amount<0),x=>x.month,x=>-x.amount));fillFilters();renderRows();renderRules()}
function fillFilters(){for(const[id,s]of[['#source',new Set(state.tx.map(x=>x.source))],['#month',new Set(state.tx.map(x=>x.month))],['#category',new Set(state.tx.map(x=>x.category))]]){let e=$(id),value=e.value,first=e.options[0].outerHTML;e.innerHTML=first+[...s].sort().map(v=>`<option>${esc(v)}</option>`).join('');e.value=value}}
function renderRows(){let q=norm($('#search').value),s=$('#source').value,m=$('#month').value,c=$('#category').value,a=state.tx.filter(x=>(!q||norm(x.desc+' '+x.orig).includes(q))&&(!s||x.source===s)&&(!m||x.month===m)&&(!c||x.category===c));$('#tbody').innerHTML=a.slice().reverse().map(x=>`<tr data-key="${esc(x.key)}"><td>${x.date}</td><td>${esc(x.source)}</td><td class="desc">${esc(x.desc)}</td><td>${esc(x.orig)}</td><td class="num">${money(x.amount)}</td><td><select class="cat">${opts(x.category)}</select></td><td><input class="inc" type="checkbox" ${x.included?'checked':''}></td></tr>`).join('');let u=state.tx.filter(x=>x.included&&x.category==='Ikke kategorisert');$('#uncat').innerHTML=u.length?`<table><tbody>${u.map(x=>`<tr data-key="${esc(x.key)}"><td>${x.date}</td><td class="desc">${esc(x.desc)}</td><td>${esc(x.orig)}</td><td><select class="ucat"><option>Velg</option>${opts('')}</select></td></tr>`).join('')}</tbody></table>`:'Alle transaksjoner er kategorisert.'}
function renderRules(){$('#ruleCat').innerHTML=opts(CATS[0]);$('#ruleList').innerHTML=`<table><tbody>${state.rules.map((r,i)=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><button data-rule="${i}">Slett</button></td></tr>`).join('')}</tbody></table>`}
function save(){localStorage.setItem('regnskap',JSON.stringify(state))}function exportExcel(){if(!window.XLSX)return alert('Excel-biblioteket mangler');let wb=XLSX.utils.book_new(),data=state.tx.map(x=>({Dato:x.date,Måned:x.month,Kilde:x.source,Beskrivelse:x.desc,Type:x.type,Beløp:x.amount,Kategori:x.category,Inkludert:x.included?'Ja':'Nei','Original kategori':x.orig}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Transaksjoner');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Trefftekst','Kategori'],...state.rules]),'Regler');XLSX.writeFile(wb,'kategorisert_regnskap.xlsx')}
$('#files').addEventListener('change',async e=>{let files=[...e.target.files],errors=[];$('#status').textContent=`Leser ${files.length} fil(er)...`;for(const f of files){try{f.name.toLowerCase().endsWith('.pdf')?await parsePdf(f):await parseExcel(f)}catch(err){errors.push(f.name+': '+err.message)}}render();save();$('#status').textContent=errors.length?`Ferdig med ${errors.length} feil`:`${state.tx.length} transaksjoner lastet`;if(errors.length)alert(errors.join('\n'));e.target.value='' });
$('#export').onclick=exportExcel;$('#save').onclick=()=>{save();$('#status').textContent='Lagret lokalt'};$('#clear').onclick=()=>{if(confirm('Tømme alle data?')){state={tx:[],rules:[...BASE]};save();render()}};$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.view).classList.add('on')});['search','source','month','category'].forEach(id=>$('#'+id).oninput=renderRows);document.addEventListener('change',e=>{let tr=e.target.closest('tr[data-key]');if(!tr)return;let x=state.tx.find(y=>y.key===tr.dataset.key);if(e.target.classList.contains('cat')){x.category=e.target.value;x.manual=true}if(e.target.classList.contains('inc'))x.included=e.target.checked;if(e.target.classList.contains('ucat')){x.category=e.target.value;x.manual=true;state.rules.unshift([x.orig||x.desc,x.category])}save();render()});$('#addRule').onclick=()=>{let t=$('#ruleText').value.trim();if(t){state.rules.unshift([t,$('#ruleCat').value]);$('#ruleText').value='';save();render()}};document.addEventListener('click',e=>{if(e.target.dataset.rule!==undefined){state.rules.splice(+e.target.dataset.rule,1);save();render()}});try{let saved=JSON.parse(localStorage.getItem('regnskap'));if(saved?.tx)state=saved}catch{}render();loadLibraries();
</script></body></html>
