<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regnskapsverktøy</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>:root{--b:#17365d;--a:#4472c4;--l:#dbe3ec;--bg:#f5f7fa;--r:#b42318;--g:#067647}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI;background:var(--bg);color:#17202a}header{background:var(--b);color:#fff;padding:20px}main{max-width:1500px;margin:auto;padding:16px}.box,.card{background:#fff;border:1px solid var(--l);border-radius:9px;padding:14px;margin-bottom:12px}.tools,.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.pick,select,input{font:inherit;border:1px solid var(--a);border-radius:6px;padding:8px 11px;background:#fff}.pick,.primary,.tabs .on{background:var(--a);color:#fff}.pick input{display:none}.status{margin-left:auto;color:#667085}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card small{color:#667085}.card b{display:block;font-size:20px;margin-top:5px}.neg{color:var(--r)}.pos{color:var(--g)}.scroll{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:7px 9px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--b);color:#fff}td.d{white-space:normal;min-width:280px}td.n{text-align:right}.filters>*{min-width:150px}.barrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 110px;gap:10px;margin:8px 0}.bar{background:#e8eef6;height:18px;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.status{width:100%;margin:0}}</style></head><body>
<header><h1>Privat regnskapsverktøy</h1><div>Importer kontoutskrifter, kategoriser og eksporter til Excel. Data behandles lokalt i nettleseren.</div></header><main>
<div class="box tools"><label class="pick">Last opp filer<input id="files" type="file" multiple accept=".xlsx,.xls,.csv,.pdf"></label><button id="export" class="primary">Eksporter Excel</button><button id="save">Lagre lokalt</button><button id="clear">Tøm</button><span id="status" class="status">Klar</span></div>
<div class="tabs"><button class="on" data-v="overview">Oversikt</button><button data-v="tx">Transaksjoner</button><button data-v="uncat">Ikke kategorisert</button><button data-v="rules">Regler</button></div>
<section id="overview" class="view on"><div id="cards" class="cards"></div><div class="box"><h2>Utgifter per kategori</h2><div id="bars"></div></div><div class="box"><h2>Utgifter per måned</h2><div id="months"></div></div></section>
<section id="tx" class="view"><div class="box"><div class="filters"><input id="q" placeholder="Søk"><select id="fs"><option value="">Alle kilder</option></select><select id="fm"><option value="">Alle måneder</option></select><select id="fc"><option value="">Alle kategorier</option></select></div><div class="scroll"><table><thead><tr><th>Dato</th><th>Kilde</th><th>Beskrivelse</th><th>Original kategori</th><th>Beløp</th><th>Kategori</th><th>Med</th></tr></thead><tbody id="body"></tbody></table></div></div></section>
<section id="uncat" class="view"><div class="box"><h2>Ikke kategorisert</h2><div id="ulist"></div></div></section>
<section id="rules" class="view"><div class="box"><h2>Regler</h2><div class="tools"><input id="rt" placeholder="Trefftekst"><select id="rc"></select><button id="ra">Legg til</button></div><div id="rlist"></div></div></section>
</main><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const cats=['Abonnement og digitale tjenester','Alkohol','Avgifter og offentlige betalinger','Bil og drivstoff','Bolig','Bøker og medier','Dagligvarer','Elektronikk og programvare','Familie og lommepenger','Forsikring','Frakt og porto','Gebyr og renter','Godteri og snacks','Helse og personlig','Hobby, korps og fritid','Innbetaling/refusjon','Intern overføring','Klær og sko','Lån og sparing','Lønn','Markedsføring','Netthandel og øvrige varer','Parkering og bom','Restaurant og takeaway','Reise og overnatting','Strøm og energi','Sykkel','Telefon og internett','Transport','Ikke kategorisert'];
const baseRules=[['bicycle','Sykkel'],['sykkel','Sykkel'],['grocery','Dagligvarer'],['supermarket','Dagligvarer'],['rema 1000','Dagligvarer'],['kiwi ','Dagligvarer'],['bunnpris','Dagligvarer'],['coop prix','Dagligvarer'],['restaurant','Restaurant og takeaway'],['fast food','Restaurant og takeaway'],['fuel dispenser','Bil og drivstoff'],['tesla','Bil og drivstoff'],['circle k','Bil og drivstoff'],['uno-x','Bil og drivstoff'],['skyttelpass','Parkering og bom'],['parking','Parkering og bom'],['atb','Transport'],['bus lines','Transport'],['passenger rail','Transport'],['hotel','Reise og overnatting'],['clothing','Klær og sko'],['shoe stores','Klær og sko'],['music stores','Hobby, korps og fritid'],['sporting goods','Hobby, korps og fritid'],['skolekorps','Hobby, korps og fritid'],['speider','Hobby, korps og fritid'],['electronics','Elektronikk og programvare'],['computer software','Elektronikk og programvare'],['google one','Abonnement og digitale tjenester'],['youtube','Abonnement og digitale tjenester'],['amazon prime','Abonnement og digitale tjenester'],['vinmonopolet','Alkohol'],['book stores','Bøker og medier'],['aliexpress','Netthandel og øvrige varer'],['temu','Netthandel og øvrige varer'],['advertising services','Markedsføring'],['candy/nut/confection','Godteri og snacks'],['posten norge','Frakt og porto'],['postnord','Frakt og porto'],['skatteetaten','Avgifter og offentlige betalinger'],['lønn','Lønn'],['aker solutions','Lønn'],['renter','Gebyr og renter'],['kontoregulering','Intern overføring'],['revolut::','Intern overføring'],['nordnet bank','Intern overføring'],['bank norwegian','Intern overføring'],['kredittbanken','Intern overføring'],['tilde stavik','Familie og lommepenger'],['sigrid stavik','Familie og lommepenger'],['fremtind','Forsikring'],['tryg forsikring','Forsikring'],['enter forsikring','Forsikring'],['fortum','Strøm og energi'],['agva kraft','Strøm og energi'],['lyse tele','Telefon og internett'],['lånekasse','Lån og sparing']];let S={tx:[],rules:[...baseRules]};const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)],norm=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(x||0);
function date(v){if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10);let s=String(v||''),m=s.match(/(\d{4})-(\d\d)-(\d\d)/);if(m)return m[0];m=s.match(/(\d\d)\.(\d\d)\.(\d{2,4})/);return m?`${m[3].length==2?'20'+m[3]:m[3]}-${m[2]}-${m[1]}`:''}
function classify(d,o,a,t){let z=norm(d+' '+o);if(a>0){if(z.includes('kontoregulering')||z.includes('nordnet bank'))return['Intern overføring',false];if(z.includes('lønn')||z.includes('aker solutions'))return['Lønn',true];return['Innbetaling/refusjon',true]}for(const[k,c]of S.rules)if(z.includes(norm(k)))return[c,c!=='Intern overføring'];if(['innbetaling','creditvoucher'].includes(norm(t)))return['Intern overføring',false];return['Ikke kategorisert',true]}
function add(o){o.key=[o.date,o.source,norm(o.desc),Number(o.amount).toFixed(2)].join('|');if(S.tx.some(x=>x.key===o.key))return;[o.category,o.included]=classify(o.desc,o.orig,o.amount,o.type);S.tx.push(o)}
async function excel(f){let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});for(const sn of wb.SheetNames)for(const r of XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null})){let d,desc,a,type,orig='',source;if('Dato'in r&&'Forklaring'in r){source=f.name.toLowerCase().includes('sbanken')?'sBanken':f.name.toLowerCase().includes('alt')?'Alt-i-ett':'Bankkonto';d=date(r.Dato);desc=r.Forklaring;a=Number(r['Inn på konto']||0)-Number(r['Ut fra konto']||0);type=a>=0?'Innbetaling':'Utbetaling'}else if('TransactionDate'in r){source='Bank Norwegian';d=date(r.TransactionDate);desc=r.Text;a=Number(r.Amount||0);type=r.Type;orig=r['Merchant Category']||''}else continue;if(d&&desc&&Number.isFinite(a))add({date:d,month:d.slice(0,7),source,desc:String(desc),amount:a,type,orig,sheet:sn})}}
async function pdf(f){let doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let p=1;p<=doc.numPages;p++){let c=await(await doc.getPage(p)).getTextContent(),text=c.items.map(x=>x.str).join(' '),re=/(\d{2}\.\d{2}\.\d{2})\s+\d{2}\.\d{2}\.\d{2}\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})(?=\s+\d{2}\.\d{2}\.\d{2}|$)/g,m;while(m=re.exec(text)){let d=date(m[1]),a=Number(m[3].replace(/\./g,'').replace(',','.'));add({date:d,month:d.slice(0,7),source:'Coop Mastercard',desc:m[2],amount:a,type:m[2].toLowerCase()==='innbetaling'?'Innbetaling':'Kjøp',orig:'',sheet:'PDF '+p})}}}
const opts=s=>cats.map(c=>`<option${c===s?' selected':''}>${c}</option>`).join('');function group(a,k,v){let o={};a.forEach(x=>o[k(x)]=(o[k(x)]||0)+v(x));return o}function bars(id,o){let a=Object.entries(o).sort((x,y)=>y[1]-x[1]),m=Math.max(...a.map(x=>x[1]),1);$(id).innerHTML=a.map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><span class="bar"><i style="width:${v/m*100}%"></i></span><span class="n">${money(v)}</span></div>`).join('')||'Ingen data'}
function render(){S.tx.sort((a,b)=>a.date.localeCompare(b.date));let a=S.tx.filter(x=>x.included),out=-a.filter(x=>x.amount<0).reduce((n,x)=>n+x.amount,0),inc=a.filter(x=>x.amount>0).reduce((n,x)=>n+x.amount,0),u=a.filter(x=>x.category==='Ikke kategorisert').length;$('#cards').innerHTML=[['Utgifter',money(out),'neg'],['Inntekter',money(inc),'pos'],['Netto',money(inc-out),inc-out<0?'neg':'pos'],['Transaksjoner',a.length,''],['Ikke kategorisert',u,u?'neg':'']].map(x=>`<div class="card"><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join('');bars('#bars',group(a.filter(x=>x.amount<0),x=>x.category,x=>-x.amount));bars('#months',group(a.filter(x=>x.amount<0),x=>x.month,x=>-x.amount));filters();rows();rules();$('#status').textContent=`${S.tx.length} transaksjoner, ${u} ikke kategorisert`}
function filters(){for(const[id,v]of[['#fs',new Set(S.tx.map(x=>x.source))],['#fm',new Set(S.tx.map(x=>x.month))],['#fc',new Set(S.tx.map(x=>x.category))]]){let e=$(id),c=e.value;e.innerHTML=e.options[0].outerHTML+[...v].sort().map(x=>`<option>${esc(x)}</option>`).join('');e.value=c}}
function rows(){let q=norm($('#q').value),s=$('#fs').value,m=$('#fm').value,c=$('#fc').value,a=S.tx.filter(x=>(!q||norm(x.desc+' '+x.orig).includes(q))&&(!s||x.source===s)&&(!m||x.month===m)&&(!c||x.category===c));$('#body').innerHTML=a.slice().reverse().map(x=>`<tr data-k="${esc(x.key)}"><td>${x.date}</td><td>${esc(x.source)}</td><td class="d">${esc(x.desc)}</td><td>${esc(x.orig)}</td><td class="n">${money(x.amount)}</td><td><select class="cat">${opts(x.category)}</select></td><td><input class="inc" type="checkbox" ${x.included?'checked':''}></td></tr>`).join('');let u=S.tx.filter(x=>x.included&&x.category==='Ikke kategorisert');$('#ulist').innerHTML=u.length?`<table><tbody>${u.map(x=>`<tr data-k="${esc(x.key)}"><td>${x.date}</td><td class="d">${esc(x.desc)}</td><td>${esc(x.orig)}</td><td><select class="ucat"><option>Velg</option>${opts('')}</select></td></tr>`).join('')}</tbody></table>`:'Alle transaksjoner er kategorisert.'}
function rules(){$('#rc').innerHTML=opts(cats[0]);$('#rlist').innerHTML=`<table><tbody>${S.rules.map((r,i)=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><button data-ri="${i}">Slett</button></td></tr>`).join('')}</tbody></table>`}
function save(){localStorage.setItem('regnskap',JSON.stringify(S))}function exportX(){let wb=XLSX.utils.book_new(),data=S.tx.map(x=>({Dato:x.date,Måned:x.month,Kilde:x.source,Beskrivelse:x.desc,Type:x.type,Beløp:x.amount,Kategori:x.category,Inkludert:x.included?'Ja':'Nei','Original kategori':x.orig}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Transaksjoner');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Trefftekst','Kategori'],...S.rules]),'Regler');XLSX.writeFile(wb,'kategorisert_regnskap.xlsx')}
$('#files').onchange=async e=>{let fs=[...e.target.files],err=[];$('#status').textContent='Leser...';for(const f of fs)try{f.name.toLowerCase().endsWith('.pdf')?await pdf(f):await excel(f)}catch(x){err.push(f.name+': '+x.message)}render();save();if(err.length)alert(err.join('\n'));e.target.value=''};$('#export').onclick=exportX;$('#save').onclick=save;$('#clear').onclick=()=>{if(confirm('Tømme alle data?')){S={tx:[],rules:[...baseRules]};save();render()}};$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on')});['q','fs','fm','fc'].forEach(x=>$('#'+x).oninput=rows);document.onchange=e=>{let tr=e.target.closest('tr[data-k]');if(!tr)return;let x=S.tx.find(y=>y.key===tr.dataset.k);if(e.target.classList.contains('cat')){x.category=e.target.value;x.manual=true}if(e.target.classList.contains('inc'))x.included=e.target.checked;if(e.target.classList.contains('ucat')){x.category=e.target.value;x.manual=true;S.rules.unshift([x.orig||x.desc,x.category])}save();render()};$('#ra').onclick=()=>{let t=$('#rt').value.trim();if(t){S.rules.unshift([t,$('#rc').value]);$('#rt').value='';save();render()}};document.onclick=e=>{if(e.target.dataset.ri!==undefined){S.rules.splice(+e.target.dataset.ri,1);save();render()}};try{let z=JSON.parse(localStorage.getItem('regnskap'));if(z?.tx)S=z}catch{}render();
</script></body></html>
